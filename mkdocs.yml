site_name: PID3Net
site_description: >-
  Physics-Informed Deep learning Network for Dynamic Diffraction imaging —
  end-to-end documentation, API reference, and design notes.
site_author: Vu Tien-Sinh
site_url: https://sinhvt3421.github.io/pid3net/
repo_name: sinhvt3421/PID3Net
repo_url: https://github.com/sinhvt3421/PID3Net
edit_uri: edit/main/docs/
copyright: Copyright &copy; Vu Tien-Sinh and contributors — released under the MIT License.

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sinhvt3421/PID3Net
  version:
    provider: mike
    default: latest

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            # Pure static analysis — never fall back to dynamic import,
            # because the CI docs image does not install TensorFlow.
            allow_inspection: false
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            docstring_style: google
            docstring_section_style: table
            members_order: source
            filters: ["!^_"]
            show_bases: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 2
            docstring_options:
              warn_missing_types: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Apply to a new dataset: getting-started/new-dataset.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Physics: concepts/physics.md
      - Refinement: concepts/refinement.md
      - Losses & regularisers: concepts/losses.md
  - Guides:
      - Training: guides/training.md
      - Inference: guides/inference.md
      - Configuration: guides/configuration.md
      - Probe modes: guides/probe-modes.md
      - Adding a model: guides/adding-a-model.md
  - API reference:
      - Overview: api/index.md
      - Models: api/models.md
      - Layers: api/layers.md
      - Losses: api/losses.md
      - Utils: api/utils.md
      - Train: api/train.md
  - Changelog: changelog.md
  - Contributing: contributing.md
  - About: about.md

watch:
  - pid3net
  - CHANGELOG.md
  - README.md
