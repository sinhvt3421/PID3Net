  refine:
    # --- B. Poisson-MLE projection ---
    # Blends the classical hard modulus replacement (Gaussian MLE) with a
    # Poisson log-likelihood gradient step.  rho=0 at init = pure hard
    # projection = current behaviour.  Less biased on low-count pixels.
    poisson_projection:
      enabled: False
      eps: 1.0e-3 # Tikhonov inside I_meas / (|Psi|^2 + eps)
