model:
  filters: 8
  kernel: 3
  k_pool: 2
  pool: "max"
  n_cov: 4
  n_dcov: 4
  act: "swish"
  img_size: 384
hyper:
  batch_size: 4
  loss: 2.0
  masking: "/home/share/Mg_Alloys_Ptycho/processed_data/Moving_chart/mask_probe_378.npy"
  probe: "/home/share/Mg_Alloys_Ptycho/processed_data/Moving_chart/probe_function_378.npy"
  probe_mode: "multi_c"
  n_refine: 5
  n_time: 5
  sample: "chart"
  dist: True
  lr: 0.001
  probe_norm: 0.00145435
  save_path: "trained_models/public/Moving_chart_10s_1ms_poiss_mask"
  train_data: "/home/share/Mg_Alloys_Ptycho/processed_data/Moving_chart/dataset2_10s_5fr_1.4ms.npz"
